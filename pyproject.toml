[project]
name = "mix-agent"
version = "0.1.0"
description = "企业级多智能体协同系统：涵盖需求逆向、动静态代码解析与高危SQL安全审计"
authors = [
    {name = "charles.feng",email = "charles.feng@quintarabio.com"}
]
readme = "README.md"
requires-python = ">=3.11"

[tool.poetry]
packages = [{include = "mix_agent", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.1"}
pydantic = "^2.7.4"
pydantic-settings = "^2.3.0"
python-dotenv = "^1.0.1"
langgraph = "^0.0.60"
qdrant-client = "^1.9.1"
sqlglot = "^25.3.0"
tree-sitter = "^0.22.3"
redis = "^5.0.4"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.30"}
asyncpg = "^0.29.0"
alembic = "^1.13.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.7"
httpx = "^0.27.0"
docker = "^7.1.0"
aiosqlite = "^0.20.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
mix-agent = "mix_agent.cli:main"
